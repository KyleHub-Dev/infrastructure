# =====================================================================
# Forward-zone overrides for Unbound.
# =====================================================================
# By default we recurse fully — Unbound talks to root → TLD →
# authoritative servers directly. No upstream DNS provider sees our
# queries.
#
# Add a forward-zone here only if you need to delegate a specific
# zone to an internal authoritative server, e.g.:
#
# forward-zone:
#   name: "internal.kylehub.dev."
#   forward-addr: 192.168.1.10
#   forward-first: no
#
# Forwarding ALL queries (name: ".") would defeat the purpose of
# running Unbound — don't do it unless you're debugging.
