# ============================================================
#  OSINT Platform — Full Stack (Podman Compose)
# ============================================================
#  Runtime:   Podman (rootless)
#  Ingress:   NEWT tunnel only (no exposed ports)
#  Auth:      Pangolin IAP → Remote-User header
#  Stack:     FastAPI · Celery · Redis · Neo4j · Meilisearch
# ============================================================

services:

  # ── API Gateway ────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: osint-api
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - MEILI_URL=http://meilisearch:7700
      - AUTH_HEADER=${AUTH_HEADER:-Remote-User}
      - DEFAULT_TTL_DAYS=${DEFAULT_TTL_DAYS:-365}
    depends_on:
      - redis
      - neo4j
      - meilisearch
    networks:
      - osint-net

  # ── Frontend (React + Sigma.js) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: osint-frontend
    restart: unless-stopped
    networks:
      - osint-net

  # ── Redis (Celery Broker + Result Backend) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: osint-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - osint-net

  # ── Neo4j (Graph Database) ────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: osint-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
    volumes:
      - neo4j-data:/data
      - ./config/neo4j/init.cypher:/var/lib/neo4j/import/init.cypher:ro
    networks:
      - osint-net

  # ── Meilisearch (Document Store & Full-Text Search) ────────
  meilisearch:
    image: getmeili/meilisearch:v1
    container_name: osint-meili
    restart: unless-stopped
    environment:
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili-data:/meili_data
    networks:
      - osint-net

  # ── Celery Workers — OSINT Tool Analyzers ──────────────────

  worker-maigret:
    build:
      context: .
      dockerfile: workers/maigret/Dockerfile
    container_name: osint-worker-maigret
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - MEILI_URL=http://meilisearch:7700
      - TOR_SOCKS_PROXY=${TOR_SOCKS_PROXY:-socks5://tor-proxy:9050}
    command: celery -A worker worker -Q queue_username --concurrency=2 --loglevel=info
    depends_on:
      - redis
      - tor-proxy
    networks:
      - osint-net

  worker-holehe:
    build:
      context: .
      dockerfile: workers/holehe/Dockerfile
    container_name: osint-worker-holehe
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - MEILI_URL=http://meilisearch:7700
    command: celery -A worker worker -Q queue_email --concurrency=2 --loglevel=info
    depends_on:
      - redis
    networks:
      - osint-net

  worker-theharvester:
    build:
      context: .
      dockerfile: workers/theharvester/Dockerfile
    container_name: osint-worker-harvester
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - MEILI_URL=http://meilisearch:7700
    command: celery -A worker worker -Q queue_domain --concurrency=2 --loglevel=info
    depends_on:
      - redis
    networks:
      - osint-net

  worker-social:
    build:
      context: .
      dockerfile: workers/social-analyzer/Dockerfile
    container_name: osint-worker-social
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - MEILI_URL=http://meilisearch:7700
    command: celery -A worker worker -Q queue_username --concurrency=2 --loglevel=info
    depends_on:
      - redis
    networks:
      - osint-net

  # ── Tor SOCKS5 Proxy (outbound anonymization) ─────────────
  tor-proxy:
    image: osminogin/tor-simple
    container_name: osint-tor
    restart: unless-stopped
    networks:
      - osint-net

  # ── NEWT Tunnel (sole ingress into the stack) ──────────────
  newt:
    image: fosrl/newt:latest
    container_name: osint-newt
    restart: unless-stopped
    environment:
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}
      - NEWT_ENDPOINT=${PANGOLIN_ENDPOINT}
    networks:
      - osint-net

# ── Volumes ──────────────────────────────────────────────────
volumes:
  redis-data:
  neo4j-data:
  meili-data:

    # ── Network ──────────────────────────────────────────────────
networks:
  osint-net:
    driver: bridge
