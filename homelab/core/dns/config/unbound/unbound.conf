# =====================================================================
# Unbound — recursive resolver behind AdGuard Home
# =====================================================================
# Listens on 0.0.0.0:53 inside the dns-net bridge ONLY.
# AdGuard Home (sibling container) reaches it as `unbound:53`.
# No host port binding — Unbound is never directly reachable from the
# internet or the LAN. All public queries arrive on AdGuard's DoT/DoH
# endpoints and are forwarded here over the bridge.
# =====================================================================

server:
  verbosity: 1
  log-queries: no
  log-replies: no
  log-servfail: yes

  # ---- Listening ----
  interface: 0.0.0.0
  interface: ::0
  port: 53
  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes

  # ---- Access control ----
  # Only the docker bridge networks. AdGuard is always inside one of
  # these CIDRs when it queries us.
  access-control: 127.0.0.0/8 allow
  access-control: 10.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow
  access-control: fd00::/8 allow
  access-control: fe80::/10 allow
  access-control: ::1 allow
  access-control: 0.0.0.0/0 refuse
  access-control: ::/0 refuse

  # ---- Privacy ----
  hide-identity: yes
  hide-version: yes
  identity: "dns"
  version: "private"

  # ---- DNSSEC ----
  # The trust anchor file is auto-bootstrapped + maintained by Unbound
  # (RFC 5011). It lives under /opt/unbound/etc/unbound/var/ which is
  # backed by the dns-unbound-data volume so updates persist.
  auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"
  val-clean-additional: yes
  val-permissive-mode: no

  # ---- Hardening ----
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  harden-referral-path: yes
  harden-algo-downgrade: yes
  use-caps-for-id: yes
  unwanted-reply-threshold: 10000000

  # ---- Performance / caching ----
  num-threads: 2
  msg-cache-size: 50m
  msg-cache-slabs: 4
  rrset-cache-size: 100m
  rrset-cache-slabs: 4
  cache-min-ttl: 300
  cache-max-ttl: 86400
  cache-max-negative-ttl: 3600
  prefetch: yes
  prefetch-key: yes
  serve-expired: yes
  serve-expired-ttl: 86400

  # ---- Modern resolver behaviour ----
  qname-minimisation: yes
  aggressive-nsec: yes
  edns-buffer-size: 1232
  minimal-responses: yes

  # ---- Defence in depth (in case access-control is misconfigured) ----
  ratelimit: 1000

  # ---- Local data ----
  # Optional A-records for *.lab.kylehub.dev etc.
  include: /opt/unbound/etc/unbound/a-records.conf

# ---- Forward zones (off by default — we recurse fully) ----
include: /opt/unbound/etc/unbound/forward-records.conf
