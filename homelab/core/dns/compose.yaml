# =====================================================================
# homelab/core/dns - Self-hosted DNS stack
# =====================================================================
#   dns-unbound : recursive resolver with DNSSEC + caching, internal-only
#   dns-adguard : DNS filter, DoT/DoH endpoints, dashboard
#   dns-lego    : Let's Encrypt cert (Cloudflare DNS-01) for ${CERT_DOMAIN}
#
# Edge attachment:
#   dns-adguard joins homelab-core-edge so core-newt (in core/_edge)
#   can reach the dashboard at dns-adguard:3000. Pangolin Resource:
#     adguard.kylehub.dev -> dns-adguard:3000  (Zitadel IAP)
#
# Public host ports (DoT/DoH cannot tunnel through Pangolin and are
# the only services in this zone that bind to the host's public
# interface):
#   853/tcp+udp - DoT
#   443/tcp     - DoH
# Family-device restriction is enforced inside AdGuard via "Allowed
# clients" / DoT client identifiers, NOT at the network layer.
#
# Plain DNS (port 53) is intentionally NOT bound: this is a Hetzner
# dedicated server, there is no LAN behind it. Mobile devices and
# routers must use DoT or DoH.
#
# Loopback-only debug binding for the dashboard (127.0.0.1:3000).
# Production access is via core-newt -> Pangolin.
#
# See SETUP.md for first-run instructions and the Cloudflare DNS records
# you must create manually.
# =====================================================================

services:
  dns-unbound:
    image: docker.io/mvance/unbound:latest
    container_name: dns-unbound
    restart: unless-stopped
    volumes:
      - ./config/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
      - ./config/unbound/a-records.conf:/opt/unbound/etc/unbound/a-records.conf:ro
      - ./config/unbound/forward-records.conf:/opt/unbound/etc/unbound/forward-records.conf:ro
      - dns-unbound-data:/opt/unbound/etc/unbound/var
    networks:
      # Pinned address so AdGuard's upstream config stays stable across
      # recreates (Podman 4.x reassigns IPs by container start order).
      dns-net:
        ipv4_address: 172.30.10.10
    healthcheck:
      test: ["CMD", "drill", "@127.0.0.1", "-p", "53", "nlnetlabs.nl"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  dns-adguard:
    image: docker.io/adguard/adguardhome:latest
    container_name: dns-adguard
    restart: unless-stopped
    depends_on:
      dns-unbound:
        condition: service_healthy
    networks:
      - dns-net
      - homelab-core-edge
    ports:
      # Public DoT - primary endpoint for mobile (Android Private DNS).
      - "853:853/tcp"
      - "853:853/udp"
      # Public DoH - alternative for clients that prefer DoH.
      - "443:443/tcp"
      # Dashboard - loopback only for ad-hoc debug. Production access
      # is via core-newt -> Pangolin (adguard.kylehub.dev).
      - "127.0.0.1:3000:3000/tcp"
    volumes:
      - dns-adguard-work:/opt/adguardhome/work
      - dns-adguard-conf:/opt/adguardhome/conf
      # Shared cert volume populated by dns-lego, mounted read-only.
      - dns-certs:/opt/adguardhome/conf/certs:ro
    environment:
      TZ: ${TZ:-Europe/Berlin}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dns-lego:
    image: docker.io/goacme/lego:latest
    container_name: dns-lego
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/run.sh"]
    environment:
      CERT_DOMAINS: ${CERT_DOMAINS:-dns.kylehub.dev}
      ACME_EMAIL: ${ACME_EMAIL}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    volumes:
      - dns-lego-data:/data
      - dns-certs:/certs
      - ./config/lego/run.sh:/scripts/run.sh:ro
      - ./config/lego/renew-hook.sh:/scripts/renew-hook.sh:ro
      # Podman API socket - mounted so the renew-hook can trigger
      # `podman restart dns-adguard` after a successful renew. Path
      # depends on runtime mode; set PODMAN_SOCKET in .env. Defaults
      # to the rootless socket for the typical UID 1000 layout.
      - ${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock
    networks:
      - dns-net

networks:
  dns-net:
    driver: bridge
    # Pinned subnet so dns-unbound's static IP (172.30.10.10) is valid
    # and stable. Default Podman IPAM picks 10.89.x/24 dynamically and
    # would conflict with that.
    ipam:
      config:
        - subnet: 172.30.10.0/24
  homelab-core-edge:
    external: true

volumes:
  dns-unbound-data:
    driver: local
  dns-adguard-work:
    driver: local
  dns-adguard-conf:
    driver: local
  dns-certs:
    driver: local
  dns-lego-data:
    driver: local
