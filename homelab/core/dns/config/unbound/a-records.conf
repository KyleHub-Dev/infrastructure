# =====================================================================
# Local A / AAAA / PTR records for Unbound.
# =====================================================================
# This file is empty by default. Prefer "DNS rewrites" in the AdGuard
# Home UI (Filters → DNS rewrites) for domain-level overrides — they
# are easier to manage and survive Unbound restarts cleanly.
#
# Use this file only when you need an authoritative answer at the
# resolver layer (e.g. an internal-only zone that AdGuard should not
# even see).
#
# Examples (uncomment and adjust):
#
# local-zone: "lab.kylehub.dev." static
# local-data: "router.lab.kylehub.dev. IN A 192.168.1.1"
# local-data: "nas.lab.kylehub.dev.    IN A 192.168.1.50"
# local-data-ptr: "192.168.1.1  router.lab.kylehub.dev"
# local-data-ptr: "192.168.1.50 nas.lab.kylehub.dev"
