# =====================================================================
# homelab/core/dns — Self-hosted DNS stack
# =====================================================================
#   unbound  : recursive resolver with DNSSEC + caching, internal-only
#   adguard  : DNS filter, DoT/DoH endpoints, dashboard
#   lego     : Let's Encrypt cert (Cloudflare DNS-01) for ${CERT_DOMAIN}
#   newt     : Pangolin tunnel for the AdGuard dashboard
#
# See SETUP.md for first-run instructions and the Cloudflare DNS records
# you need to create manually.
# =====================================================================

services:
  # ===================================================================
  # Unbound — recursive resolver
  # Reachable internally as `unbound:53` over dns-net. No host port
  # binding — it never sees public traffic directly.
  # ===================================================================
  unbound:
    image: docker.io/mvance/unbound:latest
    container_name: dns-unbound
    restart: unless-stopped
    volumes:
      - ./config/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
      - ./config/unbound/a-records.conf:/opt/unbound/etc/unbound/a-records.conf:ro
      - ./config/unbound/forward-records.conf:/opt/unbound/etc/unbound/forward-records.conf:ro
      - dns-unbound-data:/opt/unbound/etc/unbound/var
    networks:
      - dns-net
    healthcheck:
      test: ["CMD", "drill", "@127.0.0.1", "-p", "53", "nlnetlabs.nl"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ===================================================================
  # AdGuard Home — filter + DoT/DoH endpoints + dashboard
  # ===================================================================
  # Public host bindings: 853 (DoT), 443 (DoH).
  # LAN-only host binding: ${LAN_IP}:53 (plain DNS for local router).
  # Dashboard (3000) is reachable only through the NEWT tunnel.
  # ===================================================================
  adguard:
    image: docker.io/adguard/adguardhome:latest
    container_name: dns-adguard
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    networks:
      - dns-net
    ports:
      # --- Public ---
      # DNS over TLS — primary endpoint for mobile (Android Private DNS).
      - "853:853/tcp"
      - "853:853/udp"
      # DNS over HTTPS — alternative for clients that prefer DoH.
      - "443:443/tcp"
      # --- LAN only ---
      # Plain DNS, bound to the host's LAN IP only. Public 53 = open
      # resolver = abuse vector, do NOT change this to 0.0.0.0.
      - "${LAN_IP}:53:53/tcp"
      - "${LAN_IP}:53:53/udp"
      # --- Bridge only ---
      # Dashboard. The host port mapping exists for local-host debugging
      # only; production access is via newt → Pangolin.
      - "3000:3000/tcp"
    volumes:
      - dns-adguard-work:/opt/adguardhome/work
      - dns-adguard-conf:/opt/adguardhome/conf
      # Shared cert volume populated by lego, mounted read-only.
      - dns-certs:/opt/adguardhome/conf/certs:ro
    environment:
      TZ: ${TZ:-Europe/Berlin}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===================================================================
  # lego — Let's Encrypt cert for ${CERT_DOMAIN} via Cloudflare DNS-01
  # ===================================================================
  # Issues on first run, then renews every 12h. After a successful
  # issue/renew, the renew-hook copies the cert into the shared
  # dns-certs volume and `podman restart`s dns-adguard so AdGuard
  # picks up the new TLS material (it does not auto-reload from disk).
  # ===================================================================
  lego:
    image: docker.io/goacme/lego:latest
    container_name: dns-lego
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/run.sh"]
    environment:
      CERT_DOMAIN: ${CERT_DOMAIN:-dns.kylehub.dev}
      ACME_EMAIL: ${ACME_EMAIL}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    volumes:
      - dns-lego-data:/data
      - dns-certs:/certs
      - ./config/lego/run.sh:/scripts/run.sh:ro
      - ./config/lego/renew-hook.sh:/scripts/renew-hook.sh:ro
      # Mounted so the renew-hook can `podman restart dns-adguard`.
      # See SETUP.md for the rootful-podman socket path.
      - /run/podman/podman.sock:/run/podman/podman.sock
    networks:
      - dns-net

  # ===================================================================
  # NEWT — Pangolin tunnel for the AdGuard dashboard
  # Pangolin routes adguard.kylehub.dev → newt:3000 → AdGuard.
  # Same shape as the existing apps/adguard NEWT block.
  # ===================================================================
  newt:
    image: docker.io/fosrl/newt:latest
    container_name: dns-newt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT}
      NEWT_ID: ${NEWT_ID}
      NEWT_SECRET: ${NEWT_SECRET}
    networks:
      - dns-net
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    depends_on:
      adguard:
        condition: service_healthy

networks:
  dns-net:
    driver: bridge

volumes:
  dns-unbound-data:
    driver: local
  dns-adguard-work:
    driver: local
  dns-adguard-conf:
    driver: local
  dns-certs:
    driver: local
  dns-lego-data:
    driver: local
