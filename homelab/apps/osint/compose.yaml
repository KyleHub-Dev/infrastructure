services:
  # 1. TOR PROXY - Outgoing only, no exposed ports
  tor-proxy:
    image: osminogin/tor-simple
    container_name: osint-tor
    restart: always
    networks:
      - osint-net

  # 2. SPIDERFOOT - Central Intelligence Dashboard
  spiderfoot:
    image: smicallef/spiderfoot:latest
    container_name: osint-spiderfoot
    restart: unless-stopped
    volumes:
      - ./data/spiderfoot:/var/lib/spiderfoot
    networks:
      - osint-net

  # 3. REPORT VIEWER - Browse results (HTML/PDF)
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: osint-viewer
    restart: unless-stopped
    volumes:
      - ./data/reports:/srv
      - ./filebrowser.db:/database.db
    networks:
      - osint-net
    command: --noauth # Auth handled by Pangolin

  # 4. TOOL RUNNER - CLI engine for Maigret, Sherlock, Holehe, Toutatis
  osint-tools:
    build:
      context: ./tools
      dockerfile: Dockerfile.tools
    container_name: osint-runner
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./data/reports:/app/reports
    depends_on:
      - tor-proxy
    networks:
      - osint-net

  # 5. SOCIAL ANALYZER - Identity and Social Media Profiling Dashboard
  social-analyzer:
    image: qeeqbox/social-analyzer:latest
    container_name: osint-social-analyzer
    restart: unless-stopped
    networks:
      - osint-net

  # 6. BLACKBIRD - Fast Username Enumeration Web UI
  blackbird:
    image: p1ngul1n0/blackbird:latest
    container_name: osint-blackbird
    restart: unless-stopped
    command: python blackbird.py --web
    networks:
      - osint-net

  # 7. NEWT TUNNEL - Single tunnel for the entire stack
  # Configure routes in Pangolin to reach each service
  newt:
    image: fosrl/newt:latest
    container_name: osint-newt
    restart: unless-stopped
    environment:
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}
      - NEWT_ENDPOINT=${PANGOLIN_ENDPOINT}
    networks:
      - osint-net

networks:
  osint-net:
    driver: bridge
