# =====================================================================
# OpenTelemetry Collector - obs-otel
# =====================================================================
# Receives telemetry from apps via OTLP (gRPC 4317 / HTTP 4318) on the
# homelab-core-data network. Forwards logs to obs-loki and exposes
# metrics on :8889 for obs-prometheus to scrape.
#
# The previous filelog receiver (reading /var/lib/docker/containers)
# was removed: paths are wrong on Podman, and infra-wide container
# log harvesting is out of scope for this stack (see project memory
# project_observability_scope.md).
# =====================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  resource:
    attributes:
      - key: deployment.environment
        value: ${ENVIRONMENT}
        action: insert

  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

exporters:
  loki:
    endpoint: http://obs-loki:3100/loki/api/v1/push
    labels:
      attributes:
        service.name: "service"
        level: "level"
      resource:
        deployment.environment: "environment"

  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otel

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [loki]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
