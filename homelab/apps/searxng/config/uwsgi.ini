[uwsgi]
# SearXNG uWSGI config
# Worker/thread counts are set via UWSGI_WORKERS / UWSGI_THREADS env vars in docker-compose

uid = searxng
gid = searxng

workers = %(_UWSGI_WORKERS)d
threads = %(_UWSGI_THREADS)d

chunk-size = 8192

# Bind on all interfaces within the container network
http = 0.0.0.0:8080

master = true
module = searx.webapp
callable = app
lazy-apps = true
enable-threads = true

# Logging
log-5xx = true
disable-logging = false

# Timeouts
harakiri = 30
socket-timeout = 30
