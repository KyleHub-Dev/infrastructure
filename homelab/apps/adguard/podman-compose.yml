version: '3.8'

services:
  newt:
    image: docker.io/fosrl/newt:latest
    container_name: adguard-newt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT}
      NEWT_ID: ${NEWT_ID}
      NEWT_SECRET: ${NEWT_SECRET}
    networks:
      - adguard-net
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1

  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard-home
    restart: unless-stopped
    depends_on:
      - newt
    networks:
      - adguard-net
    ports:
      # DNS over TLS (public, exposed on host)
      - "853:853/tcp"
      - "853:853/udp"
      # Regular DNS (optional, for local use)
      - "53:53/tcp"
      - "53:53/udp"
      # Web UI (internal only, accessed through NEWT tunnel via Pangolin)
      - "3000:3000/tcp"
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    environment:
      # Optional: Configure initial setup
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  adguard-net:
    driver: bridge

volumes:
  adguard-work:
    driver: local
  adguard-conf:
    driver: local
