services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - searxng
    volumes:
      - ./config:/etc/searxng:rw,U
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME}/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY}
      - UWSGI_WORKERS=${UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${UWSGI_THREADS:-4}
    security_opt:
      - label=disable
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  newt:
    image: fosrl/newt:latest
    container_name: searxng-newt
    restart: unless-stopped
    networks:
      - searxng
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT}
      - NEWT_ID=${NEWT_TUNNEL_ID}
      - NEWT_SECRET=${NEWT_TUNNEL_SECRET}
    depends_on:
      searxng:
        condition: service_healthy

networks:
  searxng:
    driver: bridge
