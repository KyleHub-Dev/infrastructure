# =====================================================================
# homelab/core/storage - RustFS S3-compatible object storage
# =====================================================================
#   storage-rustfs : S3-compatible object storage API + admin console
#
# Host prep (one-time, before first `podman-compose up`):
#   The data directory must be owned by UID 10001 (RustFS' runtime UID
#   inside the container). Pick the path that matches your runtime:
#     Rootful Podman  :  sudo chown -R 10001:10001 /srv/rustfs/data
#     Rootless Podman :  sudo chown $(id -u):$(id -g) /srv/rustfs/data
#                        podman unshare chown -R 10001:10001 /srv/rustfs/data
#   See SETUP.md for details.
#
# Edge attachment:
#   storage-rustfs joins homelab-core-edge so core-newt (in core/_edge)
#   can reach the console at storage-rustfs:9001. Pangolin Resource:
#     storage.kylehub.dev -> storage-rustfs:9001  (Zitadel IAP)
#
# Data attachment:
#   storage-rustfs ALSO joins homelab-core-data so on-host clients
#   (langfuse-web, langfuse-worker, future apps) can reach the S3 API
#   directly at storage-rustfs:9000 without traversing the Pangolin
#   tunnel. core-newt is deliberately NOT on homelab-core-data, so the
#   S3 API is not accidentally re-exposed via Pangolin.
#
# Optional external S3 access (s3.kylehub.dev) is opt-in: create a
# Pangolin Resource pointing at storage-rustfs:9000 with NO IAP. Do
# NOT enable IAP on the S3 endpoint - normal S3 clients use AWS-Sig
# request signing and an auth gateway will break the flow.
#
# No host ports are exposed.
# =====================================================================

services:
  storage-rustfs:
    # RustFS does not yet ship a stable major.minor scheme; track
    # :latest and pin once releases stabilise.
    image: docker.io/rustfs/rustfs:latest
    container_name: storage-rustfs
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_SERVER_DOMAINS: ${RUSTFS_SERVER_DOMAINS:-storage.kylehub.dev}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_OBS_LOGGER_LEVEL:-info}
    volumes:
      - ${RUSTFS_DATA_DIR:-/srv/rustfs/data}:/data:Z
    networks:
      - homelab-core-edge
      - homelab-core-data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  homelab-core-edge:
    external: true
  homelab-core-data:
    external: true
