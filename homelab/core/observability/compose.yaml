# =====================================================================
# homelab/core/observability - Central log/metric aggregation
# =====================================================================
#   obs-otel       : OpenTelemetry collector (OTLP receiver)
#   obs-loki       : log storage
#   obs-prometheus : metrics storage
#   obs-grafana    : UI / dashboards
#
# Edge attachment:
#   obs-grafana joins homelab-core-edge so core-newt (in core/_edge)
#   can reach the UI at obs-grafana:3000. Pangolin Resource:
#     grafana.kylehub.dev -> obs-grafana:3000  (Zitadel IAP for Phase 1;
#     swap to native Grafana OIDC against Zitadel later if desired)
#
# Data attachment:
#   obs-otel joins homelab-core-data so on-host apps (langfuse-*,
#   future homelab/apps/*) can ship telemetry directly to
#   obs-otel:4317 (gRPC) or obs-otel:4318 (HTTP) without traversing
#   the public network.
#
# obs-loki and obs-prometheus stay private to obs-net. obs-grafana
# reaches them by service name on obs-net.
#
# Scope (see project memory project_observability_scope.md):
#   This stack is the receiving end for app telemetry pushed via OTel
#   from user-developed webapps. Infra-wide scraping (node-exporter,
#   cAdvisor, postgres-exporter) is intentionally NOT included yet -
#   add when the user has decided what infra signals matter.
#
# No host ports are exposed.
# =====================================================================

services:
  obs-otel:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    container_name: obs-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    restart: unless-stopped
    networks:
      - obs-net
      - homelab-core-data
    depends_on:
      - obs-loki

  obs-loki:
    image: docker.io/grafana/loki:latest
    container_name: obs-loki
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./config/loki.yaml:/etc/loki/config.yaml:ro
      - obs-loki-data:/loki
    restart: unless-stopped
    networks:
      - obs-net

  obs-prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: obs-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - obs-prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - obs-net

  obs-grafana:
    image: docker.io/grafana/grafana:latest
    container_name: obs-grafana
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.kylehub.dev}
    volumes:
      - obs-grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - obs-net
      - homelab-core-edge
    depends_on:
      - obs-loki
      - obs-prometheus

networks:
  obs-net:
    driver: bridge
  homelab-core-edge:
    external: true
  homelab-core-data:
    external: true

volumes:
  obs-loki-data:
    driver: local
  obs-prometheus-data:
    driver: local
  obs-grafana-data:
    driver: local
