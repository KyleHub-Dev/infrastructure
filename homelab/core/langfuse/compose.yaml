# =====================================================================
# homelab/core/langfuse - LLM observability
# =====================================================================
#   langfuse-web        : Next.js UI + API
#   langfuse-worker     : background event processor
#   langfuse-postgres   : OLTP database
#   langfuse-clickhouse : OLAP / event store
#   langfuse-redis      : queue / cache (AOF + RDB persistence)
#
# Object storage:
#   Langfuse uses the central RustFS instance from
#   homelab/core/storage. There is NO MinIO in this stack. Provision
#   a dedicated bucket and access key in RustFS first; see .env.example.
#
# Edge attachment:
#   langfuse-web joins homelab-core-edge so core-newt (in core/_edge)
#   can reach the UI at langfuse-web:3000. Pangolin Resource:
#     langfuse.kylehub.dev -> langfuse-web:3000  (Zitadel IAP for
#     Phase 1; swap to native NextAuth -> Zitadel later if desired)
#
# Data attachment:
#   langfuse-web AND langfuse-worker join homelab-core-data so they
#   reach storage-rustfs:9000 directly without going through Pangolin.
#
# Browser-facing presigned URLs (media uploads, batch exports) require
# LANGFUSE_S3_EXTERNAL_ENDPOINT pointing at a publicly reachable S3
# endpoint, e.g. https://s3.kylehub.dev (an opt-in Pangolin Resource on
# the storage stack with no IAP). Until set, media uploads from the
# browser will fail. See .env.example.
#
# No host ports are exposed.
# =====================================================================

services:
  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    container_name: langfuse-web
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    env_file:
      - .env
    environment: &langfuse-shared-env
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@langfuse-postgres:5432/${POSTGRES_DB}

      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH}
      REDIS_TLS_ENABLED: "false"

      # Object storage = central RustFS. Same bucket, different
      # prefixes for events / media / batch exports.
      LANGFUSE_USE_AZURE_BLOB: "false"

      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

      LANGFUSE_S3_BATCH_EXPORT_ENABLED: ${LANGFUSE_S3_BATCH_EXPORT_ENABLED:-false}
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: ${LANGFUSE_S3_BUCKET}
      LANGFUSE_S3_BATCH_EXPORT_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: ${LANGFUSE_S3_ENDPOINT}
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: ${LANGFUSE_S3_EXTERNAL_ENDPOINT:-${LANGFUSE_S3_ENDPOINT}}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY}
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/

      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}

      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      SMTP_CONNECTION_URL: ${SMTP_CONNECTION_URL:-}

      AUTH_CUSTOM_ID: ${AUTH_CUSTOM_ID:-}
      AUTH_CUSTOM_NAME: ${AUTH_CUSTOM_NAME:-}
      AUTH_CUSTOM_ISSUER: ${AUTH_CUSTOM_ISSUER:-}
      AUTH_CUSTOM_CLIENT_ID: ${AUTH_CUSTOM_CLIENT_ID:-}
      AUTH_CUSTOM_CLIENT_SECRET: ${AUTH_CUSTOM_CLIENT_SECRET:-}
      AUTH_CUSTOM_SCOPE: ${AUTH_CUSTOM_SCOPE:-openid email profile}
    networks:
      - langfuse-net
      - homelab-core-edge
      - homelab-core-data

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    env_file:
      - .env
    environment:
      <<: *langfuse-shared-env
    networks:
      - langfuse-net
      - homelab-core-data

  langfuse-postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:-16}
    container_name: langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    networks:
      - langfuse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  langfuse-clickhouse:
    # Pin to a Langfuse-supported major. Verify against the Langfuse
    # self-host compatibility notes when bumping.
    image: docker.io/clickhouse/clickhouse-server:25
    container_name: langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    networks:
      - langfuse-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  langfuse-redis:
    image: docker.io/redis:7
    container_name: langfuse-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_AUTH}
      - --maxmemory-policy
      - noeviction
      - --save
      - "60 1000"
      - --appendonly
      - "yes"
    volumes:
      - langfuse-redis-data:/data
    networks:
      - langfuse-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_AUTH} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  langfuse-net:
    driver: bridge
  homelab-core-edge:
    external: true
  homelab-core-data:
    external: true

volumes:
  langfuse-postgres-data:
    driver: local
  langfuse-clickhouse-data:
    driver: local
  langfuse-clickhouse-logs:
    driver: local
  langfuse-redis-data:
    driver: local
