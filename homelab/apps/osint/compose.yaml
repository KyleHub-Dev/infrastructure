# ============================================================
#  OSINT Platform - Full Stack (Podman Compose)
# ============================================================
#  Runtime:   Podman (rootless)
#  Ingress:   NEWT tunnel only (no exposed ports)
#  Auth:      Pangolin IAP → Remote-User header
#  Stack:     FastAPI · Celery · Redis · Neo4j · Meilisearch
# ============================================================

services:

  # ── API Gateway ────────────────────────────────────────────
  osint-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: osint-api
    container_name: osint-api
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - MEILI_URL=http://osint-meili:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - AUTH_HEADER=${AUTH_HEADER:-Remote-User}
      - DEFAULT_TTL_DAYS=${DEFAULT_TTL_DAYS:-365}
      - SEED_USER=${SEED_USER:-demo@osint.local}
    depends_on:
      osint-redis:
        condition: service_started
      osint-neo4j:
        condition: service_healthy
      osint-meili:
        condition: service_started
    networks:
      - osint-net

  # ── Frontend (React + Sigma.js) ────────────────────────────
  osint-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: osint-frontend
    container_name: osint-frontend
    restart: unless-stopped
    depends_on:
      - osint-api
    networks:
      - osint-net

  # ── Redis (Celery Broker + Result Backend) ─────────────────
  osint-redis:
    image: redis:7-alpine
    container_name: osint-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - osint-net

  # ── Neo4j (Graph Database) ────────────────────────────────
  osint-neo4j:
    image: neo4j:5-community
    container_name: osint-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - osint-net

  # ── Meilisearch (Document Store & Full-Text Search) ────────
  osint-meili:
    image: getmeili/meilisearch:v1
    container_name: osint-meili
    restart: unless-stopped
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili-data:/meili_data
    networks:
      - osint-net

  # ── Celery Workers - OSINT Tool Analyzers ──────────────────

  osint-worker-maigret:
    build:
      context: .
      dockerfile: workers/maigret/Dockerfile
    image: osint-worker-maigret
    container_name: osint-worker-maigret
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - MEILI_URL=http://osint-meili:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - TOR_SOCKS_PROXY=${TOR_SOCKS_PROXY:-socks5://osint-tor:9050}
    command: celery -A worker worker -Q queue_maigret --concurrency=2 --loglevel=info
    depends_on:
      - osint-redis
      - osint-tor
    networks:
      - osint-net

  osint-worker-holehe:
    build:
      context: .
      dockerfile: workers/holehe/Dockerfile
    image: osint-worker-holehe
    container_name: osint-worker-holehe
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - MEILI_URL=http://osint-meili:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    command: celery -A worker worker -Q queue_holehe --concurrency=2 --loglevel=info
    depends_on:
      - osint-redis
    networks:
      - osint-net

  osint-worker-harvester:
    build:
      context: .
      dockerfile: workers/theharvester/Dockerfile
    image: osint-worker-harvester
    container_name: osint-worker-harvester
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - MEILI_URL=http://osint-meili:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    command: celery -A worker worker -Q queue_harvester --concurrency=2 --loglevel=info
    depends_on:
      - osint-redis
    networks:
      - osint-net

  osint-worker-social:
    build:
      context: .
      dockerfile: workers/social-analyzer/Dockerfile
    image: osint-worker-social
    container_name: osint-worker-social
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_AUTH=${NEO4J_AUTH}
      - MEILI_URL=http://osint-meili:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    command: celery -A worker worker -Q queue_social --concurrency=2 --loglevel=info
    depends_on:
      - osint-redis
    networks:
      - osint-net

  # ── Tor SOCKS5 Proxy (outbound anonymization) ─────────────
  osint-tor:
    image: osminogin/tor-simple
    container_name: osint-tor
    restart: unless-stopped
    networks:
      - osint-net

  # ── NEWT Tunnel (sole ingress into the stack) ──────────────
  osint-newt:
    image: fosrl/newt:latest
    container_name: osint-newt
    restart: unless-stopped
    environment:
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT}
    networks:
      - osint-net

# ── Volumes ──────────────────────────────────────────────────
volumes:
  redis-data:
  neo4j-data:
  meili-data:

    # ── Network ──────────────────────────────────────────────────
networks:
  osint-net:
    driver: bridge
